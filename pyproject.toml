[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openalgo-b3-adapter"
version = "0.1.0"
description = "Adaptador FOSS do OpenAlgo para o mercado brasileiro (B3) - dados de mercado, execução de ordens e plugin de corretora"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "openalgo-b3-adapter contributors" }]
keywords = ["openalgo", "b3", "trading", "algotrading", "brasil", "bovespa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["openalgo_b3_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: testes que exigem internet ou chave de API (deselect com '-m \"not network\"')",
]
